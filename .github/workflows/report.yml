# Passes the result of the tests on to the commit as the status `tests`, which main requires.
#
# Why this is needed: GitHub does not count the checks of a run that another workflow started, and it
# holds the tests of a pull request that a workflow opened until a person approves them. So for one of
# Claude's fixes the fix workflow starts the tests, and this workflow reports how they ended. A status
# posted here counts for the pull request, because it is tied to the commit.
#
# It always runs from main, checks nothing out and runs nobody's code: it only reads how the run ended.
# The tests themselves still hold no secrets and cannot write.
name: report

on:
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Report how the tests ended
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
          FILE: ${{ github.event.workflow_run.path }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          # another workflow that merely calls itself "tests" does not count
          if [ "$FILE" != ".github/workflows/tests.yml" ]; then echo "Not the tests workflow."; exit 0; fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "Not a commit."; exit 0; fi
          case "$RESULT" in
            success) state=success; text="The tests pass" ;;
            failure|timed_out|startup_failure) state=failure; text="The tests fail" ;;
            # held for approval, cancelled or skipped: that says nothing about the code
            *) echo "Nothing to report for a run that ended as '$RESULT'."; exit 0 ;;
          esac
          gh api -X POST "repos/$GH_REPO/statuses/$SHA" -f state="$state" -f context=tests \
            -f description="$text" -f target_url="$RUN_URL" >/dev/null
