# The maintainer can ask Claude for something by writing @claude in a comment on an issue or in the
# conversation of a pull request. Only people who belong to the repository start this; anyone else is
# ignored. Read the thread before you ask: Claude reads all of it, whoever wrote it.
# (Comments inside a review do not start it: those events run the workflow file as the pull request has
# it, and such a run must never hold Claude's token.)
name: claude

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Claude's token lives in this environment, which only workflows on main may use.
    environment: claude
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
