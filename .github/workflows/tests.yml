# The test suite: on every pull request, on main, and when the fix workflow starts it for one of Claude's
# fixes. It holds no secrets and cannot write anywhere, so it is safe to run on code from anyone.
# The report workflow passes its result on as the status `tests`.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Tools the tests use
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            p7zip-full mame-tools libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: uv
        run: pipx install uv
      - name: Tests
        run: |
          uv sync --frozen
          uv run pytest -q
