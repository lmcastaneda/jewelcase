# Publishes a release when the version on main is raised, and helps the maintainer raise it.
#
#   A release   The maintainer merges a pull request that raises the version in pyproject.toml. That
#               push starts this workflow: it builds the AppImage, checks that it starts and publishes
#               it under the tag v<version>. Only a push that raised the version releases, so other
#               changes to pyproject.toml, and fixes that merge by themselves, release nothing.
#   By hand     "Run workflow" on the Actions page, from main:
#                 version 0.2.0    opens the pull request that raises the version. Merging it releases.
#                 publish ticked   releases main as it is, if its version has not been released yet
#                                  (the first release, or a second try after one that failed).
#                 neither          a trial: builds and checks the AppImage and publishes nothing.
#
# Raising the version never merges by itself, so a person decides on every release. Publishing happens
# on main only, and by hand only when the repository's owner starts it: the automation's own jobs can
# start workflows, and none of them can start a release. The job that builds runs the project's code and
# can only read; the job that publishes runs no code at all. The rules are a tested script
# (.github/scripts/release_plan.py).
name: release

on:
  push:
    branches: [main]
    paths: [pyproject.toml]
  workflow_dispatch:
    inputs:
      version:
        description: "A new version such as 0.2.0: opens the pull request that raises it. Merging that releases."
        required: false
        type: string
      publish:
        description: "No new version: release main as it is, if its version is not released yet. Unticked: a trial."
        required: false
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Raise the version in a pull request. Whether and when it merges is the maintainer's decision.
  propose:
    if: github.event_name == 'workflow_dispatch' && inputs.version != '' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # push the branch
      pull-requests: write
      actions: write         # start the tests and the gate on it
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Open the pull request that raises the version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "Start this from main."; exit 1; }
          # the script refuses anything but three plain numbers, higher than the current version
          python3 .github/scripts/release_plan.py bump "$VERSION"
          pipx install uv >/dev/null
          uv lock                                   # the lock file states the project's version too
          branch="release/v$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "The branch $branch exists already."; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add pyproject.toml src/jewelcase/__init__.py uv.lock
          git commit -q -m "Jewelcase $VERSION"
          git push -q origin "$branch"
          {
            printf 'Merging this publishes Jewelcase %s: the AppImage is built from main and released as v%s.\n\n' \
              "$VERSION" "$VERSION"
            printf 'It raises the version and changes nothing else. What has merged since the last release:\n\n'
            gh api -X POST "repos/$GH_REPO/releases/generate-notes" -f tag_name="v$VERSION" \
              -f target_commitish=main --jq .body | sed 's/@//g' || true
          } > "$RUNNER_TEMP/body.md"
          url=$(gh pr create --base main --head "$branch" --title "Jewelcase $VERSION" \
                  --body-file "$RUNNER_TEMP/body.md")
          # the tests and the gate do not start by themselves on a pull request that a workflow opened
          gh workflow run tests.yml --ref "$branch"
          gh workflow run gate.yml --ref main -f pr="${url##*/}"

  plan:
    if: github.event_name == 'push' || inputs.version == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      do: ${{ steps.plan.outputs.do }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Is there a version to release?
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (inputs.publish && github.actor == github.repository_owner)) }}
          BEFORE: ${{ github.event.before }}       # main before this push; empty when started by hand
        run: python3 .github/scripts/release_plan.py plan

  build:
    needs: plan
    if: needs.plan.outputs.do == 'release' || needs.plan.outputs.do == 'trial'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build the AppImage
        run: packaging/build-appimage.sh
      - name: It starts and states its version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          export QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1
          ./dist/Jewelcase-x86_64.AppImage --demo gui --selftest
          [ "$(./dist/Jewelcase-x86_64.AppImage --version)" = "jewelcase $VERSION" ]
      - name: Checksum
        run: cd dist && sha256sum Jewelcase-x86_64.AppImage | tee Jewelcase-x86_64.AppImage.sha256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: appimage
          path: |
            dist/Jewelcase-x86_64.AppImage
            dist/Jewelcase-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 5

  publish:
    needs: [plan, build]
    # Checked here again, in the workflow itself: on another branch the plan would be that branch's script.
    if: needs.plan.outputs.do == 'release' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:               # one release at a time; a trial never waits here, so it cannot push one out
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: appimage
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          case "$VERSION" in ''|*[!0-9.]*) echo "Not a version."; exit 1 ;; esac
          (cd dist && sha256sum -c Jewelcase-x86_64.AppImage.sha256)
          # The commit the tag marks: nothing if there is no such tag, and a failure if that cannot be told.
          tag_commit() {
            local answer
            if answer=$(gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" --jq .object.sha 2>&1); then
              echo "$answer"
            elif grep -q "HTTP 404" <<<"$answer"; then
              echo ""
            else
              echo "Could not read the tag v$VERSION: $answer" >&2; return 1
            fi
          }
          # The automation may make tags. One that already stands on another commit would become the
          # release's tag, so stop: the maintainer removes it.
          marked=$(tag_commit)
          if [ -n "$marked" ] && [ "$marked" != "$GITHUB_SHA" ]; then
            echo "The tag v$VERSION exists and marks another commit. Nothing was published."; exit 1
          fi
          gh release create "v$VERSION" dist/Jewelcase-x86_64.AppImage dist/Jewelcase-x86_64.AppImage.sha256 \
            --target "$GITHUB_SHA" --title "Jewelcase $VERSION" --generate-notes \
            --notes 'Download `Jewelcase-x86_64.AppImage`, make it executable and run it. The `.sha256` file holds its checksum.'
          marked=$(tag_commit)
          if [ "$marked" != "$GITHUB_SHA" ]; then
            echo "The release is out, but its tag does not mark the commit it was built from. Look at it now."; exit 1
          fi
