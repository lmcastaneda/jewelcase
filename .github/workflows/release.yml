# Builds the AppImage and publishes it as a release when the maintainer pushes a version tag (v0.2.0).
# Nothing automatic creates such a tag: what people download is always released by a person.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: The tag must be the version in pyproject.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          [ "v$version" = "$TAG" ] || { echo "Tag $TAG is not version $version"; exit 1; }
      - name: Build the AppImage
        run: packaging/build-appimage.sh
      - name: It starts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 \
            ./dist/Jewelcase-x86_64.AppImage --demo gui --selftest
      - name: Publish
        run: |
          gh release create "$TAG" dist/Jewelcase-x86_64.AppImage \
            --title "Jewelcase $TAG" --generate-notes --verify-tag
