<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- A game in its jewel case: a disc sliding out of a case whose cover shows a game pad's buttons.
       Its own silhouette, on a transparent background. -->
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64baff"/>
      <stop offset="1" stop-color="#3689e6"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d7389"/>
      <stop offset="1" stop-color="#273445"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#b9babd"/>
    </linearGradient>
  </defs>
  <ellipse cx="64" cy="116" rx="50" ry="5" fill="#000000" opacity="0.18"/>
  <!-- the disc, part of it showing to the right of the case -->
  <circle cx="84" cy="62" r="38" fill="url(#disc)" stroke="#667885" stroke-opacity="0.6"/>
  <path d="M84 62L119 47A38 38 0 0 1 121 71z" fill="#ffffff" opacity="0.55"/>
  <circle cx="84" cy="62" r="24" fill="none" stroke="#667885" stroke-opacity="0.25"/>
  <!-- the case -->
  <rect x="10" y="14" width="88" height="96" rx="7" fill="url(#cover)" stroke="#1a2430" stroke-opacity="0.75"/>
  <path d="M17 14h9v96h-9a7 7 0 0 1-7-7V21a7 7 0 0 1 7-7z" fill="url(#spine)"/>
  <rect x="14" y="26" width="8" height="5" rx="1.5" fill="#ffffff" opacity="0.35"/>
  <rect x="14" y="93" width="8" height="5" rx="1.5" fill="#ffffff" opacity="0.35"/>
  <!-- the cover: a direction pad and four buttons -->
  <path d="M33 58h7v-7h7v7h7v7h-7v7h-7v-7h-7z" fill="#fafafa"/>
  <circle cx="78" cy="51.5" r="4.6" fill="#f9c440"/>
  <circle cx="87" cy="61.5" r="4.6" fill="#ed5353"/>
  <circle cx="69" cy="61.5" r="4.6" fill="#9bdb4d"/>
  <circle cx="78" cy="71.5" r="4.6" fill="#fafafa"/>
  <path d="M26 15h65a6 6 0 0 1 6 6v17L26 58z" fill="#ffffff" opacity="0.12"/>
</svg>
