# ---------------------------------------------------------------- emulator settings
# kind = "settings": the files an emulator keeps its options in. Only the patterns below count, never
# "everything in the folder": BIOS files, keys, firmware, databases, caches, shaders and overlays are
# not settings and are never backed up. Every settings file is an item of its own. Emulators whose
# settings location is not known have no entry here.
[[source]]
id = "retroarch-settings"
package = "com.retroarch.aarch64"
label = "RetroArch"
kind = "settings"
root = "/sdcard/Android/data/com.retroarch.aarch64/files"
include = ["retroarch.cfg"]
items = "file"

[[source]]
id = "retroarch-core-settings"
package = "com.retroarch.aarch64"
label = "RetroArch"
kind = "settings"
root = "/sdcard/RetroArch/config"
include = ["**/*.opt", "**/*.cfg"]
items = "file"

[[source]]
id = "armsx2-settings"
package = "com.armsx2"
label = "ARMSX2"
kind = "settings"
root = "/sdcard/Android/data/com.armsx2/files"
include = ["PCSX2-Android.ini", "armsx2-settings.json", "inputprofiles/*.json", "gamesettings/*.ini"]
items = "file"

