# Where emulators keep saves, save states and settings on the device.
#
# Each [[source]] is one folder of one emulator and the patterns that pick the saves out of it.
# Folders also hold BIOS images, keys, settings and caches: only files matching `include` are saves.
# Paths were read from an RG477V (Android 14) on 2026-11-26. A folder that does not exist is simply
# skipped. Add your own in ~/.config/jewelcase/saves.toml using the same shape; an entry with the same
# id replaces the one here.
#
# kind:       "save", "state" or "settings"
# include:    globs below root. "*" stays inside one folder, "**" spans folders. Case is ignored.
# exclude:    globs that are never saves, even when include matches.
# items:      "name"   files named after the game (suffix is removed to get the game's name)
#             "folder" one directory per game; item_depth says how many path parts name it
#             "file"   every file on its own (memory cards, files named by a game ID)
# root_from:  read the folder from the emulator's own settings: { file, key }. Without key, the
#             file's first line is the folder, and `below` is appended.
# advice:     shown when folders here cannot be read.
# restore:    false when the emulator cannot read files Jewelcase puts back.
# noun:       what its items are called when not "Save", for example "Memory Card".

# ---------------------------------------------------------------- RetroArch
[[source]]
id = "retroarch-saves"
package = "com.retroarch.aarch64"
label = "RetroArch"
kind = "save"
root = "/sdcard/RetroArch/saves"
root_from = { file = "/sdcard/Android/data/com.retroarch.aarch64/files/retroarch.cfg", key = "savefile_directory" }
include = ["**/*.srm", "**/*.sav", "**/*.eep", "**/*.sra", "**/*.fla", "**/*.mpk", "**/*.rtc", "**/*.nv",
           "**/*.brm", "**/*.bkr", "**/*.dsv", "**/*.mcr", "**/*.mcd", "**/*.ram", "**/*.nvr", "**/*.bcr",
           "**/hi/*.hi"]
items = "name"
suffix = '\.[^./]+$'

[[source]]
id = "retroarch-states"
package = "com.retroarch.aarch64"
label = "RetroArch"
kind = "state"
root = "/sdcard/RetroArch/states"
root_from = { file = "/sdcard/Android/data/com.retroarch.aarch64/files/retroarch.cfg", key = "savestate_directory" }
include = ["**/*.state*"]
exclude = ["**/*.png"]
items = "name"
suffix = '\.state[^/]*$'

# ---------------------------------------------------------------- DraStic
[[source]]
id = "drastic-saves"
package = "com.dsemu.drastic"
label = "DraStic"
kind = "save"
root = "/sdcard/DraStic/backup"
include = ["*.dsv"]
items = "name"
suffix = '\.dsv$'

[[source]]
id = "drastic-states"
package = "com.dsemu.drastic"
label = "DraStic"
kind = "state"
root = "/sdcard/DraStic/savestates"
include = ["*.dss"]
items = "name"
suffix = '_\d+\.dss$'

# ---------------------------------------------------------------- PPSSPP
# Inside its app folder, PPSSPP's per-game save folders cannot be read over adb.
[[source]]
id = "ppsspp-saves"
package = "org.ppsspp.ppsspp"
label = "PPSSPP"
kind = "save"
root = "/sdcard/Android/data/org.ppsspp.ppsspp/files/PSP/SAVEDATA"
include = ["*/**"]
items = "folder"
advice = "PSP saves cannot be read where PPSSPP keeps them. Move its memory stick to /sdcard/PSP in PPSSPP's settings."

[[source]]
id = "ppsspp-states"
package = "org.ppsspp.ppsspp"
label = "PPSSPP"
kind = "state"
root = "/sdcard/Android/data/org.ppsspp.ppsspp/files/PSP/PPSSPP_STATE"
include = ["*.ppst"]
items = "file"

[[source]]
id = "ppsspp-shared-saves"
package = "org.ppsspp.ppsspp"
label = "PPSSPP"
kind = "save"
root = "/sdcard/PSP/SAVEDATA"
include = ["*/**"]
items = "folder"

[[source]]
id = "ppsspp-shared-states"
package = "org.ppsspp.ppsspp"
label = "PPSSPP"
kind = "state"
root = "/sdcard/PSP/PPSSPP_STATE"
include = ["*.ppst"]
items = "file"

