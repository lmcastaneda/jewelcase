# BIOS and firmware files Jewelcase recognises, by size and md5 checksum. Only names, sizes and checksums are
# listed here, never the files themselves.
#
# What comes from where:
# - The file names, sizes and md5 checksums are from libretro's public list of system files, System.dat
#   (libretro-database, v1.19.0, clrmamepro format), cut down to the systems Jewelcase knows.
#   libretro-database is published under CC BY-SA 4.0 (https://github.com/libretro/libretro-database).
# - Everything else is Jewelcase's own and was written by hand: which systems are listed, `need`, `note`,
#   `also_for`, the `hints` and `hint_sizes`, the `role` of each file, and the [[firmware]] entry for PS3.
#
# need = "needed": games of the system do not run without these files
# need = "optional": games run without them; the files only improve the result
# role: files of one system with the same role are alternatives of each other (one is enough: PlayStation
#       models and regions, Saturn regions); different roles are all wanted (Dreamcast: a boot file and a
#       flash file; Nintendo DS: the ARM7 BIOS, the ARM9 BIOS and the firmware). A system is "Verified"
#       when every role has a verified file, "Incomplete" when only some do. A file with no role belongs
#       to the role "". Where it is not certain that files go together they all share one role.
# hints: a file with a name like one of these and one of the hint_sizes, but a checksum not listed, is
#        reported as "found, not recognised" (a valid dump the list does not know). Hints need hint_sizes.
#
# Add your own entries in ~/.config/jewelcase/bios.toml using the same shape: a [[system]] with the same
# folder adds its files to the ones here (a file without a role joins the system's first role).

