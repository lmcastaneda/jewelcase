[project]
name = "jewelcase"
version = "0.1.0"
description = "Desktop manager for Android gaming handhelds: sync games, manage emulators."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["android", "handheld", "emulation", "es-de", "adb", "sync"]
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.11.20",
    "pyside6-essentials>=6.12.0",
]

[project.scripts]
jewelcase = "jewelcase.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jewelcase"]

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["device: needs the real handheld connected over adb"]
# test files go into the project folder, not /tmp: on many desktops /tmp is kept in memory
addopts = "-m 'not device' --basetemp=.pytest-tmp"
